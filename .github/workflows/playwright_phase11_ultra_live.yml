name: Playwright Phase 11 Ultra Live

on:
  workflow_dispatch:

concurrency:
  group: playwright-phase11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ultra_live:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate live test secrets
        env:
          TEST_TENANT: ${{ secrets.E2E_TENANT }}
          TEST_EMAIL: ${{ secrets.E2E_EMAIL }}
          TEST_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TEST_TENANT" || { echo "::error::E2E_TENANT is not configured"; exit 1; }
          test -n "$TEST_EMAIL" || { echo "::error::E2E_EMAIL is not configured"; exit 1; }
          test -n "$TEST_PASSWORD" || { echo "::error::E2E_PASSWORD is not configured"; exit 1; }

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run ultra live suite
        env:
          TEST_TENANT: ${{ secrets.E2E_TENANT }}
          TEST_EMAIL: ${{ secrets.E2E_EMAIL }}
          TEST_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test tests/e2e/phase-11-ultra --project=desktop-chromium

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase11-ultra-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
