name: Playwright Phase 11 Ultra Live

on:
  workflow_dispatch:

concurrency:
  group: playwright-phase11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ultra_live:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Validate live-test credentials
        env:
          TEST_TENANT: ${{ secrets.PLAYWRIGHT_TEST_TENANT }}
          TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TEST_TENANT}" ] || [ -z "${TEST_EMAIL}" ] || [ -z "${TEST_PASSWORD}" ]; then
            echo "::error::PLAYWRIGHT_TEST_TENANT, PLAYWRIGHT_TEST_EMAIL and PLAYWRIGHT_TEST_PASSWORD must be configured as repository secrets"
            exit 1
          fi

      - name: Run ultra live suite
        env:
          TEST_TENANT: ${{ secrets.PLAYWRIGHT_TEST_TENANT }}
          TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
        run: npx playwright test tests/e2e/phase-11-ultra --project=desktop-chromium

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase11-ultra-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
