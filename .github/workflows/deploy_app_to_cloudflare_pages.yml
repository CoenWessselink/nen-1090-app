name: Deploy App to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "functions/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.*"
      - "index.html"
      - "index.source.html"
      - "_headers"
      - ".github/workflows/deploy_app_to_cloudflare_pages.yml"

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify platform access contract
        run: npm run test:access

      - name: Lint
        run: npm run lint:ci

      - name: Type check
        run: npm run typecheck

      - name: Build immutable Pages release
        env:
          VITE_MARKETING_BASE_URL: https://weldinspectpro.com
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_DEPLOYMENT_ENV: production
        run: npm run build:pages

      - name: Verify Pages artifact
        run: |
          test -f release/index.html
          test -f release/_redirects
          test -d release/assets

      - name: Upload validated release
        uses: actions/upload-artifact@v4
        with:
          name: validated-pages-release-${{ github.sha }}
          path: release
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download validated release
        uses: actions/download-artifact@v4
        with:
          name: validated-pages-release-${{ github.sha }}
          path: release

      - name: Preflight Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CF_API_TOKEN or CF_ACCOUNT_ID is missing in GitHub Actions secrets"
            exit 1
          fi
          npx --yes wrangler@3.90.0 whoami
          npx --yes wrangler@3.90.0 pages project list | head -50

      - name: Deploy validated release to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy release --project-name=nen-1090-app
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify production app after deployment
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 20 https://app.weldinspectpro.com/ > /dev/null; then
              echo "Production app is reachable."
              exit 0
            fi
            echo "Production verification attempt ${attempt}/12 failed; retrying in 10 seconds."
            sleep 10
          done
          echo "::error::Production app did not become reachable after deployment"
          exit 1
