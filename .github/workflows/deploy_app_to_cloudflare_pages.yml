name: Deploy App to Cloudflare Pages

on:
  workflow_run:
    workflows: ["App CI + Pages Validation"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

# Secrets (repo Settings > Secrets > Actions):
#   CF_API_TOKEN — API Token met o.a. Account:Read + Cloudflare Pages:Edit
#   CF_ACCOUNT_ID — Cloudflare dashboard (account-id)

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Re-run platform access guard
        run: npm run test:platform-access

      - name: Build validated release for Pages
        env:
          VITE_MARKETING_BASE_URL: https://nen1090-marketing.pages.dev
          VITE_COMMIT_SHA: ${{ env.DEPLOY_SHA }}
          VITE_DEPLOYMENT_ENV: production
        run: npm run build:pages

      - name: Verify built Pages artifact
        run: |
          test -f release/index.html
          test -f release/_redirects
          test -d release/assets

      - name: Preflight Cloudflare credentials and Pages API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CF_API_TOKEN or CF_ACCOUNT_ID is missing in GitHub Actions secrets"
            exit 1
          fi
          npx --yes wrangler@3.90.0 whoami
          npx --yes wrangler@3.90.0 pages project list | head -50

      - name: Deploy validated commit to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy release --project-name=nen-1090-app --branch=main --commit-hash=${{ env.DEPLOY_SHA }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
