name: App CI + Pages Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'docs/**'
      - 'eslint.config.js'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: app-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Verify platform access contract
        run: npm run test:access

      - name: Lint (zero warnings)
        run: npm run lint:ci

      - name: Type check
        run: npm run typecheck

      - name: Build Pages release
        env:
          VITE_MARKETING_BASE_URL: https://weldinspectpro.com
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_DEPLOYMENT_ENV: ci
        run: npm run build:pages

      - name: Verify release output
        run: |
          test -f release/index.html
          test -f release/_redirects
          test -d release/assets

      - name: Upload Pages artifact preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-pages-release-preview
          path: release
          if-no-files-found: error
